<!-- Ultimate Game Stash file-->
<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <title>Block Blast</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/bubblfan/bl/TemplateData/style.css">
</head>
<body style="margin:0;overflow:hidden;background:#000">
  <canvas id="unity-canvas" style="width:100vw;height:100vh"></canvas>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var buildUrl = "https://cdn.jsdelivr.net/gh/bubblfan/bl/Build";
    var loaderUrl = buildUrl + "/BlockBlast1.1-8.loader.js";
    var config = {
      dataUrl: buildUrl + "/BlockBlast1.1-8.data",
      frameworkUrl: buildUrl + "/BlockBlast1.1-8.framework.js",
      codeUrl: buildUrl + "/BlockBlast1.1-8.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Block Blast",
      productVersion: "1.0",
    };
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => { createUnityInstance(canvas, config).catch(console.error); };
    document.body.appendChild(script);
  </script>
</body>
</html>
