<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Banana Simulator</title>
  <style>html,body{margin:0;padding:0;overflow:hidden;background:#000;width:100%;height:100%}#c{width:100%;height:100%}</style>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
  <div id="c"></div>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = { autoplay: "on", unmuteOverlay: "hidden" };
    window.addEventListener("DOMContentLoaded", () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      player.style.width = "100%";
      player.style.height = "100%";
      document.getElementById("c").appendChild(player);
      player.load("https://cdn.jsdelivr.net/gh/bubbls/ruffle@ad6ffa3289c102eb4a4aced92a17e4ea291603d5/bananasim.swf");
    });
  </script>
</body>
</html>
