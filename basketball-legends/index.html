<!-- Ultimate Game Stash file-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Basketball Legends</title>
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden;height:100%;width:100%}#c{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}ruffle-player{width:100%;height:100%;display:block}</style>
<script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2025.10.2/ruffle.min.js"></script>
</head>
<body>
<div id="c"></div>
<script>
const SWF="https://cdn.jsdelivr.net/gh/gameproxy/swf_storage_1@907a0283a4167ab7ce5a3f46da958d9deb1abdae/Basketball%20Legends.swf";
const c=document.getElementById("c");
function resize(){let w=innerWidth,h=Math.floor(w*3/4);if(h>innerHeight){h=innerHeight;w=Math.floor(h*4/3)}c.style.width=w+"px";c.style.height=h+"px"}
addEventListener("resize",resize);
addEventListener("DOMContentLoaded",()=>{resize();const r=RufflePlayer&&RufflePlayer.newest&&RufflePlayer.newest();if(!r){c.textContent="Ruffle failed";return}const p=r.createPlayer();p.style.width=p.style.height="100%";c.appendChild(p);p.load(SWF)});
</script>
</body>
</html>
